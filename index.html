<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bounce Back — Mia's 24 Hours V6.5</title>
<style>
:root{
  --ink:#282522; --muted:#756d64; --paper:#fff; --cream:#fffaf1;
  --line:#3d3935; --soft:#f4eee5; --green:#e9f4df; --blue:#e7f1ff;
  --pink:#f9e5e9; --yellow:#fff0bb; --red:#f8dddd; --shadow:5px 6px 0 rgba(35,31,28,.12);
}
*{box-sizing:border-box}
body{
  margin:0; color:var(--ink); background:#fff;
  font-family:"Comic Sans MS","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
}
button,input{font:inherit}
.app{max-width:1180px;margin:0 auto;padding:18px 16px 46px}
header{
  display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;
  border-bottom:3px solid var(--ink);padding-bottom:12px;margin-bottom:14px
}
.brand h1{margin:0;font-size:clamp(28px,5vw,48px);letter-spacing:-1px;transform:rotate(-.4deg)}
.brand .sub{color:var(--muted);margin-top:3px}
.langs{display:flex;gap:7px}
.lang{
  padding:8px 12px;border:2px solid var(--ink);background:#fff;border-radius:7px;
  box-shadow:2px 2px 0 var(--ink);cursor:pointer;font-weight:800
}
.lang.active{background:var(--yellow);transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
#meters{display:none;grid-template-columns:repeat(4,minmax(150px,1fr));gap:9px;margin:14px 0}
.meter{
  border:2px solid var(--ink);border-radius:9px;padding:9px;background:#fff;box-shadow:3px 3px 0 #ddd;
  transform:rotate(var(--r,0deg))
}
.meter-head{display:flex;justify-content:space-between;gap:7px;font-size:13px;font-weight:800;margin-bottom:6px}
.bar{height:12px;border:2px solid var(--ink);background:#fff;overflow:hidden}
.fill{height:100%;transition:width .35s}
#emotionFill{background:#f59b9b} #taskFill{background:#8db7ef} #energyFill{background:#f5cc64}
.time-big{font-size:20px;font-weight:900}
.delta{font-weight:900;margin-left:5px}.good{color:#39823a}.bad{color:#b24343}
.card{
  border:3px solid var(--ink);background:var(--paper);border-radius:11px;padding:20px;
  box-shadow:var(--shadow);margin-top:16px;position:relative
}
.card:before{
  content:"";position:absolute;inset:6px;border:1px dashed rgba(40,37,34,.16);
  pointer-events:none;border-radius:7px
}
.grid{display:grid;grid-template-columns:minmax(250px,340px) 1fr;gap:24px;align-items:start;position:relative;z-index:1}
.mia-pic{
  width:100%;height:330px;object-fit:contain;background:#fff;border:3px solid var(--ink);
  border-radius:8px;box-shadow:4px 4px 0 #ddd;transform:rotate(-.7deg)
}
.speech{
  margin-top:10px;padding:10px 12px;border:2px solid var(--ink);border-radius:9px;background:var(--cream);
  line-height:1.55;transform:rotate(.3deg)
}
.tag{display:inline-block;background:var(--yellow);border:2px solid var(--ink);padding:4px 9px;border-radius:999px;font-weight:900}
h2{font-size:clamp(25px,4vw,38px);margin:9px 0 10px;line-height:1.15}
p{line-height:1.75}.lead{font-size:18px}
.intro-lines{font-size:19px;line-height:1.8}
.bigline{font-size:22px;font-weight:900;margin:16px 0}
.btnrow{display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.btn{
  border:3px solid var(--ink);background:#fff;padding:10px 16px;border-radius:8px;cursor:pointer;
  font-weight:900;box-shadow:3px 3px 0 var(--ink)
}
.btn:hover{transform:translate(1px,1px);box-shadow:2px 2px 0 var(--ink)}
.btn.primary{background:#dcefcf}.btn.blue{background:#dcecff}.btn.orange{background:#ffe0b9}.btn.pink{background:#f8dde6}
.seq{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:14px}
.bucket{border:2px dashed var(--ink);padding:12px;border-radius:8px;background:#fffdf8}
.item{display:flex;justify-content:space-between;gap:8px;align-items:center;border:2px solid #716a64;background:#fff;padding:9px;margin:7px 0;border-radius:7px}
.mini{border:2px solid var(--ink);background:#eee;padding:4px 8px;border-radius:5px;cursor:pointer;font-weight:900}
.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.action{
  border:2px solid var(--ink);border-radius:9px;background:#fff;padding:11px;text-align:left;
  min-height:138px;cursor:pointer;box-shadow:3px 3px 0 #ddd
}
.action:hover:not(:disabled){transform:translateY(-2px)}
.action:disabled{opacity:.42;cursor:not-allowed;background:#eee}
.icon{font-size:27px}.action-name{font-weight:900;margin:4px 0}.action-desc{font-size:12px;color:var(--muted);line-height:1.45}
.type{display:inline-block;margin-top:7px;border:1px solid var(--ink);padding:2px 6px;border-radius:999px;font-size:11px;font-weight:900}
.type.problem{background:var(--blue)}.type.emotion{background:var(--pink)}.type.avoid{background:var(--yellow)}
.lock{font-size:11px;color:#8b4141;margin-top:5px;font-weight:800}
.settlement{display:grid;gap:8px;margin:14px 0}
.change{
  display:grid;grid-template-columns:180px 1fr auto;gap:8px;align-items:center;padding:9px 10px;border:2px solid #777;background:#fff;border-radius:7px
}
.change .nums{font-weight:900}.change .diff{font-size:18px;font-weight:1000}
.notice{padding:11px 13px;border:2px solid var(--ink);border-radius:8px;background:var(--yellow);margin-top:10px;line-height:1.55}
.notice.alert{background:var(--red)}.notice.ok{background:var(--green)}
.history{margin-top:15px;padding:10px;border:2px dashed #888;background:#fafafa}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:4px 7px;border:1px solid #777;border-radius:999px;font-size:11px;background:white}
.ending-img{width:100%;max-height:410px;object-fit:contain;border:3px solid var(--ink);background:#fff;border-radius:9px;transform:rotate(-.4deg)}
.ending-title{font-size:clamp(30px,5vw,48px);line-height:1.08;margin:8px 0}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.statpill{border:2px solid var(--ink);padding:6px 9px;border-radius:999px;background:#fff}
.options{display:grid;gap:9px;margin-top:14px}
.opt{position:relative;z-index:3;pointer-events:auto;border:2px solid var(--ink);background:#fff;padding:12px;text-align:left;border-radius:8px;cursor:pointer;line-height:1.5}
.opt:hover:not(:disabled){background:#fff6d7}.opt.selected{background:#fff0b9;box-shadow:3px 3px 0 #c7ad57}.opt:disabled{cursor:default;opacity:1;color:var(--ink)}
.opt.correct{background:#e3f3da}.opt.wrong{background:#f6dddd}
.selftip{margin-top:14px;border:3px dashed #6d5c50;padding:13px;background:#fff8e7}
.discovery{font-size:18px;font-weight:900;border:2px dashed var(--ink);padding:12px;margin-top:14px;background:#f7f1ff}
.hidden-tease{font-size:20px;font-weight:900;margin-top:18px;padding:14px;border:3px solid var(--ink);background:#fff0b9;transform:rotate(-.4deg)}
.footer-note{color:var(--muted);font-size:12px;margin-top:14px}
@media(max-width:900px){.grid{grid-template-columns:1fr}.mia-pic{height:290px}.actions{grid-template-columns:repeat(2,1fr)}#meters{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.actions,.seq,#meters{grid-template-columns:1fr}.change{grid-template-columns:1fr}.app{padding:12px 10px 38px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><h1>Bounce Back</h1><div class="sub" id="subTitle"></div></div>
  <div class="langs"><button class="lang active" id="zhBtn">繁體中文</button><button class="lang" id="enBtn">English</button></div>
</header>
<div id="meters">
  <div class="meter" style="--r:-.4deg"><div class="meter-head"><span id="emotionLabel"></span><span><span id="emotionText"></span><span id="emotionDelta" class="delta"></span></span></div><div class="bar"><div id="emotionFill" class="fill"></div></div></div>
  <div class="meter" style="--r:.35deg"><div class="meter-head"><span id="taskLabel"></span><span><span id="taskText"></span><span id="taskDelta" class="delta"></span></span></div><div class="bar"><div id="taskFill" class="fill"></div></div></div>
  <div class="meter" style="--r:-.2deg"><div class="meter-head"><span id="energyLabel"></span><span><span id="energyText"></span><span id="energyDelta" class="delta"></span></span></div><div class="bar"><div id="energyFill" class="fill"></div></div></div>
  <div class="meter" style="--r:.5deg"><div class="meter-head"><span id="timeLabel"></span><span id="timeDelta" class="delta"></span></div><div class="time-big"><span id="timeText"></span> <span id="hourWord"></span></div></div>
</div>
<main id="game"></main>
</div>

function setStore(k,v){try{localStorage.setItem(k,v)}catch(e){}}

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

 E.textContent=Math.round(emo);Tsk.textContent=Math.round(task)+"%";En.textContent=Math.round(energy);Ti.textContent=fmtTime(time);
 Ef.style.width=emo+"%";Tf.style.width=task+"%";Enf.style.width=energy+"%";

function resetState(){
 state={
  emotion:50,task:20,energy:70,time:24,
  counts:{},avoidance:0,consecutivePhone:0,consecutiveEmotion:0,sameActionStreak:0,previousAction:null,
  problemTypes:new Set(),emotionTypes:new Set(),maxSame:0,
  warnings:new Set(),history:[],
  pendingPhoneEvent:false
 };
 lastSettlement=null;endingKey=null;questionAnswered=false;selectedAnswer=null;runCounted=false;
 actionOrder=shuffle(actions.map(a=>a.id));
}
window.startSimulation=function(){resetState();view="game";render()};

function actionById(id){return actions.find(a=>a.id===id)}
function useCount(id){return state.counts[id]||0}

function computeAction(a){
 let effect={e:a.e,dEnergy:a.dEnergy,task:a.task,time:a.time,note:null};
 const nextUse=useCount(a.id)+1;
 if(a.id==="study" && state.emotion>50){effect.task=10;effect.dEnergy=-35;effect.note="highAnxiety"}
 if(a.id==="practice" && state.emotion>50){effect.task=9;effect.dEnergy=-35;effect.note="highAnxiety"}
 if(a.id==="plan")effect.task=[8,5,2][Math.min(nextUse,3)-1];
 if(a.id==="teacher")effect.task=[10,6,3][Math.min(nextUse,3)-1];
 if(a.type==="emotion" && a.id!=="phone" && nextUse>=3){effect.e=Math.round(effect.e*.5);effect.note=effect.note||"diminish"}
 if(a.id==="phone"){
  effect.e=nextUse===1?-6:nextUse===2?-3:nextUse===3?-1:nextUse===4?5:8;
  if(state.energy<=0)effect.dEnergy=0;
 }
 return effect;
}
function lockReason(a){
 if(a.id==="check" && state.task<70)return lang==="zh"?"📚 進展達 70% 後解鎖":"Unlocks at 70% progress";
 if((a.id==="plan"||a.id==="teacher") && useCount(a.id)>=3)return lang==="zh"?"🔒 已使用 3 次":"🔒 Used 3 times";
 if(state.energy<=0 && !["food","breath","nap","sleep","phone"].includes(a.id))return lang==="zh"?"⚡ Mia 暫時沒電":"⚡ Mia has no energy";
 const ef=computeAction(a);
 if(ef.dEnergy<0 && state.energy < Math.abs(ef.dEnergy) && a.id!=="phone")return lang==="zh"?`⚡ 需要至少 ${Math.abs(ef.dEnergy)} 精力`:`⚡ Needs at least ${Math.abs(ef.dEnergy)} energy`;
 return "";
}
function sceneKey(){
 if(state.energy<=0)return"crash";
 if(state.emotion>=75)return"high";
 if(state.energy<40)return"tired";
 if(state.emotion<=35)return"calm";
 if(state.emotion>=55)return"slightly";
 return"normal";
}
function miaLine(){
 if(lang==="zh"){
  if(state.energy<=0)return"我真的沒電了……";
  if(state.emotion>=75)return"我知道我要做，但腦袋有點打結。";
  if(state.energy<40)return"我還可以撐一下……但真的開始累了。";
  if(state.task>=80)return"差最後一段了。我想想現在最需要甚麼。";
  if(state.emotion<=35)return"現在比較平靜了。下一步要做甚麼？";
  return"還有時間。我們下一步怎樣走？";
 }else{
  if(state.energy<=0)return"I am completely out of battery…";
  if(state.emotion>=75)return"I know what I need to do, but my brain is tangled.";
  if(state.energy<40)return"I can keep going… but I am really getting tired.";
  if(state.task>=80)return"Almost there. What do I need most right now?";
  if(state.emotion<=35)return"I feel calmer now. What should I do next?";
  return"There is still time. What should we do next?";
 }
}
function historyHtml(){
 if(!state.history.length)return"";
 return `<div class="history"><strong>${tr().already}</strong><div class="chips">${state.history.slice(-10).map(x=>`<span class="chip">${x}</span>`).join("")}</div></div>`;
}
function renderGame(){
 showMeters(true);updateMeters();const t=tr();

  <div class="actions">${ordered.map(a=>{
    const d=a[lang],lock=lockReason(a),ef=computeAction(a);
    const typeLabel=a.type==="problem"?t.problem:a.type==="emotion"?t.emotionType:t.avoid;
    return `<button class="action" data-action="${a.id}" ${lock?"disabled":""}>
      <span class="icon">${a.icon}</span><div class="action-name">${d[0]}</div><div class="action-desc">${d[1]}<br>⏳ ${a.time} ${t.hour}</div>
      <span class="type ${a.type}">${typeLabel}</span>${lock?`<div class="lock">${lock}</div>`:""}
    </button>`}).join("")}</div>${historyHtml()}</div>
  </div></section>`;
 document.querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>chooseAction(b.dataset.action));

function chooseAction(id){
 const a=actionById(id);const lock=lockReason(a);if(lock)return;
 const before={emotion:state.emotion,task:state.task,energy:state.energy,time:state.time};
 const ef=computeAction(a);
 const prevAction=state.previousAction;
 const prevType=prevAction?actionById(prevAction)?.type:null;

 state.counts[id]=useCount(id)+1;state.maxSame=Math.max(state.maxSame,state.counts[id]);
 if(a.type==="problem"){state.problemTypes.add(id);state.consecutiveEmotion=0}
 else{
  state.emotionTypes.add(id);state.consecutiveEmotion+=1;
  if(state.consecutiveEmotion===3)state.avoidance+=1;
 }
 if(id==="phone"){
  state.avoidance+=1;state.consecutivePhone+=1;
 }else state.consecutivePhone=0;

 state.sameActionStreak=(prevAction===id)?state.sameActionStreak+1:1;
 if(a.type!=="problem" && state.sameActionStreak>=3)state.avoidance+=1;
 if(id==="movie" && prevAction==="movie")state.avoidance+=1;

 state.emotion=clamp(state.emotion+ef.e,0,100);
 state.task=clamp(state.task+ef.task,0,100);
 state.energy=clamp(state.energy+ef.dEnergy,0,100);
 state.time=clamp(state.time-ef.time,0,24);
 state.previousAction=id;
 state.history.push(`${a.icon} ${a[lang][0]}`);

 const warnings=[];
 if(ef.note==="highAnxiety")warnings.push(lang==="zh"?"⚠️ 焦慮正在影響 Mia 的學習效率：她用了更多精力，但收益下降。":"⚠️ Anxiety is reducing Mia's study efficiency: more energy, less progress.");
 if(ef.note==="diminish")warnings.push(lang==="zh"?"同一種方法仍然有幫助，但效果已沒有第一次那麼明顯。":"The same strategy still helps, but not as much as before.");
 crossWarning("emo70",before.emotion<70 && state.emotion>=70,lang==="zh"?"🌦️ Mia 的焦慮已經很高。":"🌦️ Mia's anxiety is now high.",warnings);
 crossWarning("energy40",before.energy>=40 && state.energy<40,lang==="zh"?"🪫 Mia 開始疲累。":"🪫 Mia is getting tired.",warnings);
 crossWarning("energy0",before.energy>0 && state.energy===0,lang==="zh"?"⚡ Mia 暫時沒電了。高耗能行動會暫時鎖定。":"⚡ Mia is out of energy. High-effort actions are temporarily locked.",warnings);
 crossWarning("time6",before.time>6 && state.time<=6,lang==="zh"?"⏰ 距離 deadline 只剩 6 小時。":"⏰ Only 6 hours remain.",warnings);
 crossWarning("time2",before.time>2 && state.time<=2,lang==="zh"?"🚨 最後兩小時。每一個選擇都很重要。":"🚨 Final two hours. Every choice matters.",warnings);
 crossWarning("task80",before.task<80 && state.task>=80,lang==="zh"?"🌱 快完成了。還差最後一段。":"🌱 Almost there. One last stretch.",warnings);
 if(id==="phone" && state.counts.phone===4)warnings.push(lang==="zh"?"📱 情況開始不一樣了。Mia 已經沒有真的放鬆；她開始擔心自己浪費了太多時間，焦慮反而上升。":"📱 Something has changed. Mia is no longer really relaxing; she is worrying about the time she has lost. Anxiety rises.");

 const trigger = determineEnding();
 const phoneEvent=(id==="phone" && state.consecutivePhone===3);
 state.pendingPhoneEvent=phoneEvent;
 lastSettlement={a,ef,before,after:{emotion:state.emotion,task:state.task,energy:state.energy,time:state.time},warnings,trigger};
 view="settlement";render();
}
function crossWarning(key,cond,msg,arr){if(cond && !state.warnings.has(key)){state.warnings.add(key);arr.push(msg)}}

   friend:"說出來之後，好像不用一個人扛。",exercise:"身體動一動，腦袋也鬆了一點。",food:"舒服了一點，也補回一點電。",

 }else{
  const map={
   study:"I made progress… but that used a lot of battery.",practice:"These questions showed me where I am actually stuck.",weak:"At least I stopped avoiding the part I know least well.",
   plan:"I know more clearly what should come first.",teacher:"The direction is clearer. I still have to do the work myself.",check:"Almost there. Let me check what I missed.",
   friend:"Saying it out loud makes it feel less lonely.",exercise:"Moving my body helped my brain loosen up.",food:"I feel a little better, and I got some energy back.",
   breath:"Stopping for a short while actually helped me breathe.",movie:"I feel better… but three hours really did pass.",nap:"I rested, but I am definitely not fully recharged.",
   sleep:"I finally slept. Now I need to see how much time is left.",phone:"I really meant to check for just a moment…",blame:"The more I blame myself, the worse I feel—and the task still has not moved."
  };return map[a.id];
 }
}
function changeRow(label,b,a,d,goodInverse=false,suffix=""){
 const diff=d===0?"±0":(d>0?`+${d}`:`${d}`);
 const good=goodInverse?d<0:d>0;
 return `<div class="change"><strong>${label}</strong><span class="nums">${b}${suffix} → ${a}${suffix}</span><span class="diff ${d===0?"":good?"good":"bad"}">${diff}</span></div>`;
}
function renderSettlement(){
 showMeters(true);updateMeters(lastSettlement.ef);const t=tr(),s=lastSettlement;
 const endAfter=!!s.trigger || state.pendingPhoneEvent;
 game.innerHTML=`<section class="card"><div class="grid">
  <div>${imageTag(settlementImage(s.a))}<div class="speech"><strong>${t.mia}：</strong>${reaction(s.a)}</div></div>
  <div><span class="tag">${t.settlement}</span><h2>${s.a.icon} ${s.a[lang][0]}</h2>
   <div class="settlement">
    ${changeRow(t.emotion,s.before.emotion,s.after.emotion,s.ef.e,true)}
    ${changeRow(t.task,s.before.task,s.after.task,s.ef.task,false,"%")}
    ${changeRow(t.energy,s.before.energy,s.after.energy,s.ef.dEnergy,false)}
    ${changeRow(t.time,s.before.time,s.after.time,-s.ef.time,true,"h")}
   </div>
   ${s.warnings.map(w=>`<div class="notice ${w.includes("⚠️")||w.includes("🚨")||w.includes("🌦️")?"alert":""}">${w}</div>`).join("")}
   <div class="btnrow"><button class="btn primary" onclick="afterSettlement()">${endAfter?t.seeEnding:t.continue}</button></div>
  </div></div></section>`;
}
window.afterSettlement=function(){
 if(state.pendingPhoneEvent){view="phoneEvent";render();return}
 const k=lastSettlement?.trigger || determineEnding();
 if(k){setEnding(k)}else{view="game";render()}
};

function renderPhoneEvent(){
 showMeters(true);updateMeters();const t=tr();
 game.innerHTML=`<section class="card"><div class="grid">
  ${imageTag("phonewarp")}
  <div><span class="tag">${lang==="zh"?"隱藏事件":"HIDDEN EVENT"}</span><h2>${t.phoneEventTitle}</h2><p class="lead">${t.phoneEventP}</p>
   <div class="btnrow"><button class="btn blue" onclick="phoneAway()">${t.phoneAway}</button><button class="btn pink" onclick="phoneMore()">${t.phoneMore}</button></div>
  </div></div></section>`;
}
window.phoneAway=function(){
 state.pendingPhoneEvent=false;state.consecutivePhone=0;
 const k=determineEnding();if(k)setEnding(k);else{view="game";render()}
};
window.phoneMore=function(){state.pendingPhoneEvent=false;setEnding("phone_hidden")};

function determineEnding(){
 // 1. Fear ending has priority over all ordinary endings.
 if(state.emotion>=100)return"fear";

 // 2. Completed-task endings.
 if(state.task>=100){
  if(state.time>=3 &&
     state.emotion<50 &&
     state.energy>=40 &&
     state.problemTypes.size>=2 &&
     state.emotionTypes.size>=2 &&
     state.maxSame<=2 &&
     (state.counts.phone||0)<=1){
    return"rhythm";
  }
  if(state.time<=1)return"miracle";
  if(state.time>1 && (state.emotion>=75 || state.energy<=20))return"burnout";
  return"stable";
 }

 // 3. Deadline endings.
 if(state.time<=0){
  // "Barely alive" = depleted energy + emotion still above the calm range.
  if(state.energy<=15 && state.emotion>35)return"barely";

  // Strong avoidance now requires 4 or more Avoidance Points.
  if(state.task<60 && state.avoidance>=4)return"deadline";

  // Calm, low-progress route.
  if(state.task<60 && state.emotion<=35 && state.avoidance<4)return"peace";

  // Any other unfinished route at the deadline.
  return"effort";
 }
 return null;
}
function setEnding(k){
 endingKey=k;view="ending";
 if(!runCounted){
  runCounted=true;playCount++;setStore("miaV65PlayCount",String(playCount));
  discovered.add(k);saveDiscovered();
 }
 render();
}
function renderEnding(){
 showMeters(false);const e=endings[endingKey],c=e[lang],t=tr();
 game.innerHTML=`<section class="card"><div class="grid">
  <img class="ending-img" src="${ASSETS[e.img]}" alt="${c.title}">
  <div><span class="tag">${lang==="zh"?"結局":"ENDING"}</span><div class="ending-title">${c.title}</div><p class="lead">${c.body}</p>
   <div class="stats"><span class="statpill">🌧️ ${Math.round(state.emotion)}</span><span class="statpill">📚 ${Math.round(state.task)}%</span><span class="statpill">⚡ ${Math.round(state.energy)}</span><span class="statpill">⏳ ${fmtTime(state.time)}h</span></div>
   <div class="btnrow"><button class="btn primary" onclick="goQuestion()">${t.questionTag} →</button></div>
  </div></div></section>`;
}
window.goQuestion=function(){questionAnswered=false;selectedAnswer=null;view="question";render()};

function renderQuestion(){
 showMeters(false);const q=questions[endingKey][lang],t=tr();
 game.innerHTML=`<section class="card"><div class="grid">
  ${imageTag(endings[endingKey].img)}
  <div><span class="tag">${t.questionTag}</span><h2>${q.q}</h2><p>${t.answer}</p>
   <div class="options">${q.opts.map((o,i)=>`<button type="button" class="opt ${selectedAnswer===i?"selected":""}" data-opt="${i}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join("")}</div>
   <div class="btnrow"><button id="submitAnswerBtn" type="button" class="btn primary" onclick="submitSelectedAnswer()" ${selectedAnswer===null?"disabled":""}>${t.submitAnswer}</button></div>
   <div id="qfb"></div>
  </div></div></section>`;
}
window.selectAnswer=function(i){
 if(questionAnswered)return;
 selectedAnswer=i;
 document.querySelectorAll("[data-opt]").forEach((b,idx)=>b.classList.toggle("selected",idx===i));
 const submit=document.getElementById("submitAnswerBtn");
 if(submit)submit.disabled=false;
};
window.submitSelectedAnswer=function(){
 if(questionAnswered || selectedAnswer===null)return;
 questionAnswered=true;
 const i=selectedAnswer;
 const q=questions[endingKey][lang],correct=q.correct;
 document.querySelectorAll("[data-opt]").forEach((b,idx)=>{
   b.disabled=true;
   b.classList.remove("selected");
   if(idx===correct)b.classList.add("correct");
   else if(idx===i)b.classList.add("wrong");
 });
 const submit=document.getElementById("submitAnswerBtn");
 if(submit)submit.disabled=true;
 const right=i===correct;
 const miaReaction=right?q.miaGood:q.miaTry;
 document.getElementById("qfb").innerHTML=`<div class="speech" style="margin-top:14px"><strong>${tr().mia}：</strong>${miaReaction}</div>
 <div class="notice ${right?"ok":"alert"}"><strong>${lang==="zh"?(right?"💡 這個方向抓到重點了。":"💭 這個想法很常見，再看看另一個角度。"):(right?"💡 This gets to the key idea.":"💭 This is a common thought. Try another angle.")}</strong><br><br>${q.good}</div>
 ${questions[endingKey].self?`<div class="selftip"><strong>${tr().selfTitle}</strong><br><br>${tr().selfText}</div>`:""}
 <div class="btnrow"><button class="btn primary" onclick="goSummary()">${tr().nextSummary}</button></div>`;
};
window.goSummary=function(){view="summary";render()};

function renderSummary(){
 showMeters(false);const t=tr(),e=endings[endingKey][lang];
 const tease=playCount>=2?`<div class="hidden-tease">${t.tease1}<br><br>${t.tease2}</div>`:"";
 game.innerHTML=`<section class="card"><div class="grid">
  <img class="ending-img" src="${ASSETS[endings[endingKey].img]}" alt="${e.title}">
  <div><span class="tag">${t.finalStats}</span><h2>${e.title}</h2>
   <div class="stats"><span class="statpill">🌧️ ${Math.round(state.emotion)}</span><span class="statpill">📚 ${Math.round(state.task)}%</span><span class="statpill">⚡ ${Math.round(state.energy)}</span><span class="statpill">⏳ ${fmtTime(state.time)}h</span></div>
   <div class="discovery">${t.discovered}：<strong>${discovered.size} / 10</strong></div>
   ${tease}
   <div class="btnrow"><button class="btn blue" onclick="replay()">${t.playAgain}</button></div>
  </div></div></section>`;
}
window.replay=function(){view="home";render()};

updateLabels();render();
})();
</script>
